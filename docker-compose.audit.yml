# Disposable verification project; never run these checks against user data.
services:
  app:
    ports: !override ["127.0.0.1:18085:8080", "127.0.0.1:13000:3000"]
    environment:
      PUBLIC_URL: http://localhost:18085
      DASHBOARD_PUBLIC_URL: http://localhost:13000
  dashboard:
    environment:
      GF_SERVER_ROOT_URL: http://localhost:13000/grafana/
  prometheus:
    ports: !override ["127.0.0.1:19090:9090"]
  monitoring-dashboard:
    ports: !override ["127.0.0.1:13100:3000"]
  checks:
    image: ulsatrackerstyle-sdk:audit-test-0.11.2
    build: {context: ., target: monitoring-test}
    environment:
      STORAGE_BACKEND: clickhouse
      DATABASE_URL: http://db:8123
      DATABASE_USER: app
      DATABASE_PASSWORD: app
      DATABASE_NAME: app
      APP_TEST_URL: http://app:8080
      GRAFANA_TEST_URL: http://app:3000/grafana
      EXPECTED_DASHBOARD_TITLE: UlsaTrackerStyle SDK 0.11.2
      REQUIRE_GRAFANA_CSP: "1"
      PROMETHEUS_TEST_URL: http://prometheus:9090
    command: ["npm", "run", "test:release"]
    networks: [default, monitoring]
    depends_on:
      dashboard: {condition: service_healthy}
      prometheus: {condition: service_healthy}
      monitoring-dashboard: {condition: service_healthy}
    mem_limit: 512m
