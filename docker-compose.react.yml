# Current React cabinet; historical releases remain in their source tags.
services:
  app:
    image: ulsatrackerstyle-sdk:0.11.1
    ports: !override []
    environment:
      FRONTEND_INTERNAL_URL: http://frontend:8080
      REVERSE_PROXY_HOPS: "1"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      DASHBOARD_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      LAB_IMAGE_VERSION: 0.11.1
  dashboard:
    environment:
      GF_SERVER_ROOT_URL: ${PUBLIC_URL:-http://localhost:8080}/grafana/
  prometheus:
    labels:
      io.ulsatracker.rules-revision: "0.11.1"
  frontend:
    image: ulsatrackerstyle-frontend:0.11.1
    build: {context: ., dockerfile: frontend/Dockerfile}
    pull_policy: never
    ports: ["${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"]
    environment:
      API_UPSTREAM: http://app:8080
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:8080/frontend-health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 96m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [default]
