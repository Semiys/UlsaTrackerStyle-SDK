apiVersion: 1
datasources:
  - name: UlsaTracker ClickHouse
    uid: ulsatracker-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: db
      port: 8123
      protocol: http
      username: grafana_reader
      defaultDatabase: app
      tlsSkipVerify: false
      dialTimeout: "10"
      queryTimeout: "30"
    secureJsonData:
      password: app
