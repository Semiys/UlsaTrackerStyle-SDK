global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: ulsa-api
    scrape_timeout: 5s
    static_configs:
      - targets: [app:9100]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: clickhouse
    scrape_timeout: 5s
    static_configs:
      - targets: [db:9363]
