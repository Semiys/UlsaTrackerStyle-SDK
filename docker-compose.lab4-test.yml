services:
  app:
    ports: !override ["18085:8080", "13000:3000"]
    pull_policy: never
    environment:
      DASHBOARD_PUBLIC_URL: http://localhost:13000
      PUBLIC_URL: http://localhost:18085
  dashboard:
    environment:
      GF_SERVER_ROOT_URL: http://localhost:13000/grafana/
  checks:
    image: ulsatrackerstyle-sdk:lab4-test-0.7.0
    build:
      context: .
      target: lab4-test
    environment:
      STORAGE_BACKEND: clickhouse
      DATABASE_URL: http://db:8123
      DATABASE_USER: app
      DATABASE_PASSWORD: app
      DATABASE_NAME: app
      APP_TEST_URL: http://app:8080
      GRAFANA_TEST_URL: http://app:3000/grafana
    depends_on:
      dashboard:
        condition: service_healthy
    mem_limit: 512m
